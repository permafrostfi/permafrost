<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>permafrost</title>
<meta name="description" content="Invest in an on-chain basket of Nvidia, Alphabet, Microsoft and Meta with USDC or USDT.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&display=swap">
<style>
:root{
  --paper:#FFFFFF; --ink:#000000; --ink-2:#4C5459;
  --ice:#00A8F0; --hair:rgba(0,0,0,.12); --ice-soft:rgba(0,168,240,.08);
  --s1:#004E86; --s2:#0079C4; --s3:#00A8F0; --s4:#2BB4EC;
  --f:"Oxanium","Helvetica Neue",Arial,sans-serif; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#000000; --ink:#FFFFFF; --ink-2:#98A2A8;
    --ice:#35CCFF; --hair:rgba(255,255,255,.16); --ice-soft:rgba(53,204,255,.10);
    --s1:#DFF3FF; --s2:#89E2FF; --s3:#35CCFF; --s4:#0092CF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#000000; --ink:#FFFFFF; --ink-2:#98A2A8;
  --ice:#35CCFF; --hair:rgba(255,255,255,.16); --ice-soft:rgba(53,204,255,.10);
  --s1:#DFF3FF; --s2:#89E2FF; --s3:#35CCFF; --s4:#0092CF; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--f);font-weight:400;text-transform:lowercase;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-transform:lowercase}
:focus-visible{outline:3px solid var(--ice);outline-offset:4px}

.sky{position:fixed;inset:0;z-index:0;background:var(--paper)}
.sky canvas{width:100%;height:100%;display:block}
.frame{position:fixed;inset:12px;z-index:3;pointer-events:none}
.frame b{position:absolute;width:22px;height:22px;border:2px solid var(--ice);opacity:.75}
.frame b:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
.frame b:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.frame b:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
.frame b:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}

.wbar{position:fixed;top:clamp(26px,3.4vw,48px);right:clamp(40px,4.2vw,58px);z-index:5;
  display:flex;align-items:center;gap:11px;background:var(--paper);
  border:2px solid var(--ice);padding:7px 12px;font-size:.8rem;font-weight:600;
  letter-spacing:.02em}
.wbar:empty{display:none}
.wbar em{width:8px;height:8px;background:var(--ice);font-style:normal;flex:none}
.wbar button{font-size:.72rem;font-weight:200;color:var(--ink-2);text-decoration:underline}
.wbar button:hover{color:var(--ice)}
@media (max-width:860px){.wbar{position:static;margin:0 0 18px;align-self:flex-start}}

.shell{position:relative;z-index:2;min-height:100svh;display:grid;
  grid-template-columns:minmax(300px,30rem) 1fr;grid-template-rows:auto 1fr;
  grid-template-areas:"mark right" "left right";gap:0 clamp(12px,3vw,44px);
  padding:clamp(26px,3.4vw,48px);align-content:start;pointer-events:none}
.shell>*{pointer-events:auto}
.left{grid-area:left}
.right{grid-area:right;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:flex-start;min-height:0}
.mark{grid-area:mark;padding-bottom:clamp(18px,2.2vw,28px)}
.mk{margin:0;position:relative;display:inline-block;font-weight:800;line-height:1;font-size:1rem}
.corner{position:absolute;right:-16px;bottom:-15px;width:28px;height:28px;
  border-right:3px solid var(--ice);border-bottom:3px solid var(--ice);opacity:.9}
.logo{display:flex;align-items:center;gap:.24em;text-align:left;
  font-size:clamp(2.7rem,6vw,4.9rem);line-height:.86}
.flake{flex:none;width:.78em;height:auto}
.flake .fl{fill:none;stroke:var(--ice);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.flake .hx{fill:none;stroke:var(--ink);stroke-width:5.5;stroke-linejoin:round}
.wm{font-weight:800;font-size:1em;line-height:.86;letter-spacing:-.045em;
  white-space:nowrap;color:var(--ink)}
.tag{margin:30px 0 0;max-width:44ch;font-weight:200;font-size:clamp(.95rem,1.28vw,1.08rem);
  line-height:1.55;letter-spacing:.012em}

.menu,.acts{display:flex;flex-direction:column;gap:12px;align-self:start;max-width:30rem}
.nar{margin:6px 0 0 3px;font-weight:200;font-size:.81rem;line-height:1.4;color:var(--ink-2)}
.mbtn{display:block;width:100%;padding:3px;background:var(--ink);
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));
  transition:background .12s linear}
.mbtn .in{display:flex;align-items:center;gap:13px;padding:11px 16px;text-align:left;
  background:var(--paper);color:var(--ink);font-weight:700;font-size:1.28rem;
  letter-spacing:.03em;line-height:1;
  clip-path:polygon(0 0,calc(100% - 13px) 0,100% 13px,100% 100%,13px 100%,0 calc(100% - 13px));
  transition:background .12s linear,color .12s linear}
.mbtn em{flex:none;width:9px;height:9px;background:var(--ice);font-style:normal;
  transition:box-shadow .12s linear}
.mbtn .lb{flex:1}
.mbtn i{flex:none;width:16px;height:16px;border-top:3px solid currentColor;
  border-right:3px solid currentColor;transform:rotate(45deg);transition:transform .12s linear}
.mbtn:hover .in,.mbtn:focus-visible .in{background:var(--ink);color:var(--paper)}
.mbtn:hover em{box-shadow:0 0 0 3px rgba(0,168,240,.35)}
.mbtn:hover i{transform:rotate(45deg) translate(3px,-3px)}
.mbtn:disabled{opacity:.34;cursor:default}
.mbtn:disabled:hover .in{background:var(--paper);color:var(--ink)}
.big .in{font-size:1.5rem;padding:15px 17px}

.pick{background:var(--paper);border:3px solid var(--ink);padding:16px;max-width:29rem;
  box-shadow:10px 10px 0 var(--hair)}
.pick h3{margin:0 0 13px;font-size:.76rem;letter-spacing:.12em;font-weight:700;color:var(--ice)}
.pick h3.lead{font-size:1.02rem;letter-spacing:.01em;line-height:1.35;margin-bottom:15px}
.pick p{margin:0 0 12px;font-size:.85rem;font-weight:200;line-height:1.5;color:var(--ink-2)}
.pick p:last-child{margin-bottom:0}
.conn{display:flex;align-items:center;gap:11px;font-size:.85rem;font-weight:600;
  border:2px solid var(--ice);background:var(--paper);padding:9px 12px;max-width:30rem}
.conn em{width:9px;height:9px;background:var(--ice);font-style:normal;flex:none}
.conn b{flex:1;font-weight:600;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.lnk{font-size:.78rem;font-weight:200;color:var(--ink-2);text-decoration:underline;padding:5px 0;
  flex:none}
.back{font-size:.76rem;font-weight:200;color:var(--ink-2);text-decoration:underline;
  padding:6px 0;margin-top:13px;display:inline-block}

.amt{margin-top:17px;max-width:30rem}
.amt label{display:block;font-size:.78rem;font-weight:200;color:var(--ink-2);margin-bottom:7px}
.field{display:flex;align-items:center;gap:9px;border:3px solid var(--ink);
  background:var(--paper);padding:7px 12px}
.field .cur{font-weight:800;font-size:1.45rem;color:var(--ink-2)}
.field input{flex:1;border:0;outline:0;background:none;font:inherit;font-weight:800;
  font-size:1.45rem;color:var(--ink);min-width:0;letter-spacing:-.01em}
.field select{border:0;outline:0;background:none;font:inherit;font-weight:700;font-size:.95rem;
  color:var(--ink);text-transform:uppercase;cursor:pointer;flex:none}
.field .mx{font-size:.7rem;font-weight:700;letter-spacing:.09em;border:2px solid var(--ink);
  padding:5px 9px;flex:none}
.field .mx:hover{background:var(--ink);color:var(--paper)}
.bal{margin:7px 0 0;font-size:.75rem;font-weight:200;color:var(--ink-2)}
.hint{margin:11px 0 0;font-size:.8rem;font-weight:200;line-height:1.45;color:var(--ice);
  max-width:30rem}

.est{margin-top:17px;max-width:30rem;border-top:2px solid var(--ink)}
.est .r{display:flex;justify-content:space-between;gap:14px;padding:7px 2px;
  font-size:.82rem;border-bottom:1px solid var(--hair)}
.est .r span:first-child{font-weight:200;color:var(--ink-2)}
.est .r span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
.est .r.key span:last-child{color:var(--ice);font-size:.92rem}
.est .r.unk span:last-child{color:var(--ink-2);font-weight:200}
.est .fn{margin:9px 0 0;font-size:.72rem;font-weight:200;color:var(--ink-2);line-height:1.5}
.go{margin-top:17px;max-width:30rem}
.stat{margin-top:13px;max-width:30rem;font-size:.84rem;font-weight:600;line-height:1.5}
.stat.ok{color:var(--ice)}
.stat.bad{color:var(--ink);border-left:3px solid var(--ice);padding-left:11px;font-weight:400}
.stat a{color:var(--ice)}

.pos{margin-top:15px;max-width:30rem;border-top:3px solid var(--ink)}
.pos .r{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  padding:8px 2px;border-bottom:1px solid var(--hair);font-size:.85rem}
.pos .r span:first-child{font-weight:200;color:var(--ink-2)}
.pos .r span:last-child{font-weight:800;font-size:1.12rem;font-variant-numeric:tabular-nums}
.pos .r.up span:last-child{color:var(--ice)}
.pos .r.unk span:last-child{font-weight:200;font-size:.9rem;color:var(--ink-2)}

.right.mid{justify-content:flex-start;padding-top:clamp(250px,52vh,520px)}
.stats{border-top:3px solid var(--ink);max-width:30rem}
.right.mid .stats{margin:0 0 0 clamp(0px,4vw,70px);max-width:27rem;
  background:var(--paper);padding:2px 18px 14px}
.st{display:flex;align-items:baseline;justify-content:space-between;gap:18px;
  padding:9px 2px;border-bottom:1px solid var(--hair)}
.st .lb2{font-weight:200;font-size:.85rem;letter-spacing:.03em;color:var(--ink-2)}
.st b{font-weight:800;font-size:1.3rem;letter-spacing:-.015em;white-space:nowrap}
.st b.up{color:var(--ice)}
.stnote{margin:10px 0 0;font-weight:200;font-size:.72rem;letter-spacing:.05em;color:var(--ink-2)}

.holds{display:block;list-style:none;margin:24px 0 0;padding:0;border-top:2px solid var(--ink);
  max-width:32rem}
.holds .hh{font-size:.68rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-2);padding:7px 2px}
.holds .hh i{background:none}
.holds li{display:flex;align-items:center;gap:11px;padding:9px 2px;
  border-bottom:1px solid var(--hair);font-size:.9rem}
.holds i{flex:none;width:11px;height:11px}
.holds .tk{flex:1;font-weight:700;letter-spacing:.04em}
.holds .wt{font-weight:700;width:7em;text-align:right}
.holds .pr{width:6.5em;text-align:right;font-weight:200;color:var(--ink-2);
  font-variant-numeric:tabular-nums}

.foot{display:flex;gap:20px;margin-top:30px;padding-top:13px;max-width:30rem;
  border-top:1px solid var(--hair)}
.foot a{font-size:.78rem;font-weight:200;letter-spacing:.06em;color:var(--ink-2);
  text-decoration:none;border-bottom:1px solid transparent}
.foot a:hover{color:var(--ice);border-bottom-color:var(--ice)}
.disc{margin:11px 0 0;max-width:32rem;font-size:.7rem;font-weight:200;line-height:1.5;
  color:var(--ink-2)}

@media (max-width:860px){
  .shell{grid-template-columns:1fr;grid-template-rows:auto auto auto;
    grid-template-areas:"mark" "left" "right";gap:0}
  .menu,.acts{max-width:none}
  .right{justify-content:flex-start;margin-top:24px;padding-bottom:10px}
  .right.mid{padding-top:0;padding-bottom:10px}
  .right.mid .stats{margin-left:0;padding-left:0;padding-right:0}
  .logo{font-size:clamp(2.5rem,11.4vw,4.2rem)}
}
</style>
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"><canvas id="skyc"></canvas></div>
<div class="frame" aria-hidden="true"><b></b><b></b><b></b><b></b></div>
<div class="wbar" id="wbar"></div>

<div class="shell" id="shell">
  <header class="mark">
    <h1 class="mk"><button class="logo" data-go="home" aria-label="permafrost, home">
      <svg class="flake" viewBox="-62 -62 124 124" aria-hidden="true">
        <defs><g id="arm"><path d="M0 0 L0 -46"/><path d="M0 -24 L-13 -36 M0 -24 L13 -36"/></g></defs>
        <path class="hx" d="M0 -56 L48.5 -28 L48.5 28 L0 56 L-48.5 28 L-48.5 -28 Z"/>
        <g class="fl">
          <use href="#arm"/><use href="#arm" transform="rotate(60)"/>
          <use href="#arm" transform="rotate(120)"/><use href="#arm" transform="rotate(180)"/>
          <use href="#arm" transform="rotate(240)"/><use href="#arm" transform="rotate(300)"/>
        </g>
      </svg>
      <span class="wm" aria-hidden="true">permafrost</span>
    </button><span class="corner" aria-hidden="true"></span></h1>
    <p class="tag" id="tag"></p>
  </header>
  <div class="left" id="left"></div>
  <div class="right" id="right"></div>
</div>

<script src="../js/vendor/web3-1.98.0.iife.min.js"></script>
<script type="module">
import { Rpc, readFund, readHolder, value, jupiterPrices } from '../js/chain.js';
import { makeRouter, STABLES } from '../js/router.js';
"use strict";

/* ========== state ========== */
const RPC_URL = '/api/rpc';
const rpc = new Rpc(RPC_URL);
let addresses = null, router = null, relayInfo = null;
/* v4 (28 Nov): one signature per action, through /api/order. On until
   addresses.json says `orders: true` (set when the v4 program is live), the page
   uses the two-step flow. */
let orders = false, orderPolicy = null;
let wallet = null, fund = null, holder = null, priced = null, loadError = '';
let route = 'home', amount = '', wAmt = '', coin = 'USDC', wCoin = 'USDC';
let busy = false, built = null, statusHtml = '', statusCls = '';

const TAG_MAIN = 'the simplest way to invest in ai stocks &mdash; an immutable, '
  + 'non-custodial, passive on-chain fund holding nvidia, microsoft, meta &amp; alphabet';
const TAG_INVEST = 'you need usdc or usdt on solana in a phantom wallet to invest in permafrost';
const TAG_WITHDRAW = 'redeem your units with no restrictions';

const ORDER = ['invest', 'withdraw', 'about', 'risks'];
const SOON = ['about', 'risks'];
const NAV_NAR = {
  invest: 'invest a minimum of 5 usdc',
  withdraw: 'withdraw your share at any time',
  about: 'learn more about permafrost',
  risks: "learn about permafrost's key risks",
};
const SHADE = ['--s1', '--s2', '--s3', '--s4'];

/* Holdings drive the contour field. Placeholder until the chain answers, so the
   field draws on first paint instead of flashing empty. */
let HOLD = [
  { t: 'nvda', w: 25, p: '', s: '--s1' }, { t: 'meta', w: 25, p: '', s: '--s2' },
  { t: 'msft', w: 25, p: '', s: '--s3' }, { t: 'googl', w: 25, p: '', s: '--s4' },
];
const SHORT = { nvdax: 'nvda', googlx: 'googl', msftx: 'msft', metax: 'meta' };

/* ========== helpers ========== */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const usd = (n) => '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num = (v, d) => Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const shortAddr = (a) => a.slice(0, 4) + '…' + a.slice(-4);
/* Phantom only. Other Solana wallets inject a compatible provider, but none has
   been tested through the gas service, so the page does not offer them. */
const provider = () => (window.phantom && window.phantom.solana) || null;

function toBase(txt, dec) {
  const t = String(txt).trim().replace(/,/g, '');
  if (!/^\d+(\.\d+)?$/.test(t)) throw new Error('enter a number, for example 100');
  const [i, f = ''] = t.split('.');
  return BigInt(i) * 10n ** BigInt(dec) + BigInt((f + '0'.repeat(dec)).slice(0, dec));
}
const btn = (label, attr, extra) =>
  '<button class="mbtn' + (extra || '') + '"' + attr + '>'
  + '<span class="in"><em></em><span class="lb">' + label + '</span><i></i></span></button>';

/* ========== chain ========== */
async function load() {
  try {
    /* Check the status explicitly. A 404 body can itself be valid JSON (a bare
       `404` parses to a number), which would otherwise sail straight past. */
    const r = await fetch('../js/addresses.json');
    if (!r.ok) throw new Error('no addresses');
    addresses = await r.json();
    if (!addresses || typeof addresses !== 'object' || !addresses.unitMint) {
      throw new Error('bad addresses');
    }
  } catch { loadError = 'notlive'; render(); return; }
  if (addresses.orders) {
    try {
      const r = await (await fetch('/api/order', { cache: 'no-store' })).json();
      if (r && r.policy && r.relayer) { orders = true; orderPolicy = r.policy; relayInfo = { relayer: r.relayer }; }
    } catch { /* fall back to the two-step flow */ }
  }
  if (!orders) {
    try { relayInfo = await (await fetch('/api/relay')).json(); } catch { loadError = 'relay'; }
  }
  if (relayInfo && relayInfo.relayer) router = makeRouter({ web3: window.solanaWeb3, rpc: RPC_URL, addresses, relayer: relayInfo.relayer });
  await refresh();
}
const feeStable = () => (orderPolicy ? BigInt(Math.round(orderPolicy.feeUsd * 1e6)) : 0n);

async function refresh() {
  try {
    fund = await readFund(rpc, addresses);
  } catch { loadError = 'notlive'; render(); return; }
  if (!fund.initialized) { loadError = 'notlive'; render(); return; }

  let prices = {};
  try { prices = await jupiterPrices(fund.legs.map((l) => l.mint)); } catch { /* unpriced */ }
  priced = value(fund, prices);

  if (priced.priced) {
    HOLD = priced.parts.map((p, i) => ({
      t: SHORT[p.symbol] || p.symbol,
      w: p.weight * 100,
      p: p.value === null || p.value === undefined ? '' : '$' + num(p.value, 2),
      s: SHADE[i % 4],
    }));
  }
  lastPrices = prices;
  if (wallet) {
    try { holder = await readHolder(rpc, addresses, wallet.toBase58()); } catch { holder = null; }
    try { walletLegs = router ? await router.walletLegs(wallet.toBase58()) : null; } catch { walletLegs = null; }
  }
  render();
}
let lastPrices = {}, walletLegs = null;

/* ========== flows ========== */
async function connect() {
  const p = provider();
  if (!p) {
    statusCls = 'bad';
    statusHtml = 'phantom not found. install it, or open this page in the browser that has it.';
    render(); return;
  }
  busy = true; statusHtml = ''; render();
  try {
    const r = await p.connect();
    wallet = new window.solanaWeb3.PublicKey(r.publicKey.toString());
    busy = false;
    await refresh();
  } catch {
    busy = false; statusCls = 'bad'; statusHtml = 'connection declined.'; render();
  }
}

function disconnect() {
  try { provider() && provider().disconnect(); } catch { /* ignore */ }
  wallet = null; holder = null; built = null; statusHtml = ''; render();
}

async function review(kind) {
  built = null; statusCls = ''; statusHtml = ''; busy = true; render();
  try {
    if (kind === 'invest' && orders) {
      const amt = toBase(amount, STABLES[coin].decimals);
      if (amt < 5_000_000n) throw new Error('the minimum is 5 ' + coin.toLowerCase() + '.');
      built = await router.buildOrderInvest({ user: wallet.toBase58(), stable: coin, amount: amt, feeStable: feeStable() });
      built.args = { coin, amount: amt }; built.one = true;
    } else if (kind === 'withdraw' && orders) {
      const units = toBase(wAmt, 9);
      if (units === 0n || !holder || units > holder.rawUnits) throw new Error('enter an amount up to the units you hold.');
      built = await router.buildOrderRedeem({ user: wallet.toBase58(), stable: wCoin, units, feeStable: feeStable() });
      built.args = { coin: wCoin, units }; built.one = true;
    } else if (kind === 'invest') {
      const amt = toBase(amount, STABLES[coin].decimals);
      if (amt < 5_000_000n) throw new Error('the minimum is 5 ' + coin.toLowerCase() + '.');
      built = await router.buildInvest({
        user: wallet.toBase58(), stable: coin, amount: amt,
        tipAccount: relayInfo.tipAccount, lock: false,
      });
      built.args = { coin, amount: amt, lock: false };
    } else {
      const units = toBase(wAmt, 9);
      if (units === 0n || !holder || units > holder.rawUnits) {
        throw new Error('enter an amount up to the units you hold.');
      }
      built = await router.buildRedeem({
        user: wallet.toBase58(), stable: wCoin, units, tipAccount: relayInfo.tipAccount,
      });
      built.args = { coin: wCoin, units };
    }
    built.kind = kind;
  } catch (e) {
    statusCls = 'bad'; statusHtml = esc(e.message || e);
  }
  busy = false; render();
}

/* Sign → Phantom → gas service → confirmed. Returns the signatures. One
   transaction goes to Phantom's signTransaction, several to signAllTransactions. */
async function submit(txs, say) {
  const signed = txs.length === 1
    ? [await provider().signTransaction(txs[0])]
    : await provider().signAllTransactions(txs);
  say('sending…');
  const enc = signed.map((t) => btoa(String.fromCharCode(...t.serialize())));
  const r = await (await fetch('/api/relay', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ txs: enc }),
  })).json();
  if (r.error === 'expired') throw new Error('prices expired before sending (over a minute passed). nothing was sent. press sign again for fresh prices.');
  if (r.error) throw new Error(r.error);
  say('sent. confirming…');
  const sigs = r.signatures;
  for (let i = 0; i < 40; i++) {
    await new Promise((ok) => setTimeout(ok, 1500));
    const v = (await rpc.call('getSignatureStatuses', [sigs])).value;
    if (v.every((x) => x && (x.confirmationStatus === 'confirmed' || x.confirmationStatus === 'finalized'))) {
      if (v.some((x) => x.err)) throw new Error('a transaction failed on chain.');
      return sigs;
    }
  }
  throw new Error('not confirmed within a minute. nothing was taken unless every transaction in that step landed &mdash; check your wallet, then try again.');
}
const declined = (e) => /reject|declin/i.test(e?.message || '');

/* Two Phantom approvals per action (28 Nov). Phantom checks each transaction on
   its own and warns "this dapp could be malicious" when one can't be checked —
   and the deposit (or the sales) can't be checked until the swaps (or the
   redemption) have landed. So: step 1, then step 2 built from what arrived.
   Each step is rebuilt when it is signed, so its prices are fresh. */
/* v4: one signature → /api/order → the gas service fills and settles while the
   page asks it to keep going. Rebuilt at signing so the quotes are fresh. */
async function signOrder() {
  const kind = built.kind, args = built.args;
  const user = wallet.toBase58();
  busy = true; statusCls = '';
  const say = (t) => { statusHtml = t; render(); };
  let orderKey = null;
  try {
    say('getting fresh prices…');
    const b = kind === 'invest'
      ? await router.buildOrderInvest({ user, stable: args.coin, amount: args.amount, feeStable: feeStable() })
      : await router.buildOrderRedeem({ user, stable: args.coin, units: args.units, feeStable: feeStable() });
    say('approve in phantom…');
    const signed = await provider().signTransaction(b.txs[0]);
    say('sending…');
    const enc = btoa(String.fromCharCode(...signed.serialize()));
    let r = await (await fetch('/api/order', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ tx: enc }) })).json();
    if (r.error === 'expired') throw new Error('prices expired before sending (over a minute passed). nothing was sent. press sign again.');
    if (r.error) throw new Error(r.error);
    orderKey = r.order;
    const label = (st) => {
      const n = [0, 1, 2, 3].filter((i) => (st.filled || 0) & (1 << i)).length;
      return kind === 'invest' ? `buying the four stocks… ${n} of 4 done` : `selling the four stocks… ${n} of 4 done`;
    };
    say(label(r));
    const t0 = Date.now();
    while (r.status !== 'settled' && r.status !== 'cancelled' && r.status !== 'closed') {
      if (Date.now() - t0 > 12 * 60_000) throw new Error('taking too long; the order refunds itself after 10 minutes.');
      await new Promise((ok) => setTimeout(ok, 2500));
      r = await (await fetch('/api/order', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ step: orderKey }) })).json();
      if (r.error) throw new Error(r.error);
      say(r.filled === 15 || (r.events || []).some((e) => e.settle) ? (kind === 'invest' ? 'adding the stocks to the fund…' : 'sending your ' + args.coin.toLowerCase() + '…') : label(r));
    }
    if (r.status === 'cancelled') {
      statusCls = 'bad';
      statusHtml = 'the order could not be completed in time and was refunded in full. prices may have moved; please try again.';
      built = null; busy = false; await refresh(); return;
    }
    const sig = (r.events || []).map((e) => e.settle).filter(Boolean).pop();
    statusCls = 'ok';
    statusHtml = 'done.' + (sig ? ' <a href="https://solscan.io/tx/' + sig + '" target="_blank" rel="noopener noreferrer">view on solscan</a>' : '');
    built = null; amount = ''; wAmt = ''; busy = false;
    await refresh();
    return;
  } catch (e) {
    statusCls = 'bad';
    statusHtml = declined(e) ? 'you declined in phantom. nothing was sent.' : esc(e.message || e)
      + (orderKey ? '<br>your order is still open: it completes on its own, or refunds itself after 10 minutes. reload to check.' : '');
  }
  busy = false; render();
}

async function sign() {
  if (!built) return;
  if (built.one) return signOrder();
  const kind = built.kind, args = built.args;
  const user = wallet.toBase58();
  busy = true; statusCls = '';
  const say = (t) => { statusHtml = t; render(); };
  let stage = 1;
  try {
    const before = await router.walletLegs(user);
    say('step 1 of 2 &middot; getting fresh prices…');
    const one = kind === 'invest'
      ? await router.buildInvest({ user, stable: args.coin, amount: args.amount, tipAccount: relayInfo.tipAccount, lock: args.lock })
      : await router.buildRedeem({ user, stable: args.coin, units: args.units, tipAccount: relayInfo.tipAccount });
    say(kind === 'invest' ? 'step 1 of 2 &middot; approve buying the four stocks in phantom…'
      : 'step 1 of 2 &middot; approve handing back your units in phantom…');
    await submit(one.txs, (t) => say('step 1 of 2 &middot; ' + t));
    stage = 2;
    // Exactly what step 1 delivered (the wallet may hold other stock tokens too).
    let got = null;
    for (let i = 0; i < 10; i++) {
      const after = await router.walletLegs(user);
      got = after.map((a, j) => (a > before[j] ? a - before[j] : 0n));
      if (kind === 'invest' ? got.every((g) => g > 0n) : got.some((g) => g > 0n)) break;
      await new Promise((ok) => setTimeout(ok, 1500));
    }
    say('step 2 of 2 &middot; getting fresh prices…');
    const two = kind === 'invest'
      ? await router.buildDeposit({ user, stable: args.coin, amounts: got, tipAccount: relayInfo.tipAccount, lock: args.lock })
      : await router.buildSell({ user, stable: args.coin, amounts: got, tipAccount: relayInfo.tipAccount });
    say(kind === 'invest' ? 'step 2 of 2 &middot; approve adding the stocks to the fund in phantom…'
      : 'step 2 of 2 &middot; approve selling the stocks for ' + args.coin.toLowerCase() + ' in phantom…');
    const sigs = await submit(two.txs, (t) => say('step 2 of 2 &middot; ' + t));
    statusCls = 'ok';
    statusHtml = 'done. <a href="https://solscan.io/tx/' + sigs[sigs.length - 1]
      + '" target="_blank" rel="noopener noreferrer">view on solscan</a>';
    built = null; amount = ''; wAmt = ''; busy = false;
    await refresh();
    return;
  } catch (e) {
    const msg = declined(e) ? 'you declined in phantom. nothing was sent in this step.' : esc(e.message || e);
    if (stage === 2) {
      statusCls = 'bad';
      statusHtml = msg + '<br>step 1 went through, so the four stock tokens are in your wallet. '
        + 'use <b>stock tokens in your wallet</b> below to ' + (kind === 'invest' ? 'add them to the fund.' : 'sell them.');
      built = null; busy = false;
      await refresh();
      return;
    }
    statusCls = 'bad'; statusHtml = msg;
  }
  busy = false; render();
}

/* Stock tokens in the wallet, e.g. when step 2 of an investment or withdrawal
   didn't happen (declined, closed, expired). Hidden below $1 (rounding crumbs). */
function leftoverUsd() {
  if (!walletLegs || !fund || !fund.legs) return null;
  const each = walletLegs.map((raw, i) => (Number(raw) / 1e8) * (lastPrices[fund.legs[i].mint] || 0));
  return { each, total: each.reduce((a, b) => a + b, 0) };
}
function leftoverBlock() {
  const lo = leftoverUsd();
  if (!wallet || !lo || lo.total < 1 || built) return '';
  const allFour = walletLegs.every((r) => r > 0n);
  const c = (route === 'withdraw' ? wCoin : coin).toLowerCase();
  return '<div class="pick"><h3>stock tokens in your wallet</h3>'
    + '<p>about ' + usd(lo.total) + ' of the fund\'s stock tokens' + (allFour ? '' : ' (not all four)')
    + ' are in your wallet, for example from a step 2 that didn\'t finish. nothing is lost.</p>'
    + (allFour ? btn('add them to the fund', busy ? ' disabled' : ' data-loadd') : '')
    + btn('sell them for ' + c, busy ? ' disabled' : ' data-losell') + '</div>';
}
async function leftover(kind) {
  const lo = leftoverUsd();
  if (!lo) return;
  busy = true; statusCls = '';
  const say = (t) => { statusHtml = t; render(); };
  try {
    say('getting fresh prices…');
    const user = wallet.toBase58();
    const b = kind === 'add'
      ? await router.buildDeposit({ user, stable: coin, amounts: walletLegs, tipAccount: relayInfo.tipAccount })
      // Skip crumbs worth less than a sale's network fee.
      : await router.buildSell({ user, stable: route === 'withdraw' ? wCoin : coin, amounts: walletLegs.map((r, i) => (lo.each[i] >= 0.15 ? r : 0n)), tipAccount: relayInfo.tipAccount });
    say('approve in phantom…');
    const sigs = await submit(b.txs, say);
    statusCls = 'ok';
    statusHtml = 'done. <a href="https://solscan.io/tx/' + sigs[sigs.length - 1] + '" target="_blank" rel="noopener noreferrer">view on solscan</a>';
    busy = false;
    await refresh();
    return;
  } catch (e) {
    statusCls = 'bad'; statusHtml = declined(e) ? 'you declined in phantom. nothing was sent.' : esc(e.message || e);
  }
  busy = false; render();
}

/* The black line above the figures sits on the same baseline as the left
   column's: the about button on home, the holdings table elsewhere. Measured,
   because the left column's height differs per page. Off below 861px, where
   the layout stacks and there is nothing to align to. */
function alignStats() {
  const stats = Rt.querySelector('.stats');
  if (!stats) { Rt.style.paddingTop = ''; return; }
  if (window.innerWidth < 861) { Rt.style.paddingTop = ''; return; }
  const target = route === 'home'
    ? L.querySelectorAll('.menu .mbtn')[2]
    : L.querySelector('.holds');
  if (!target) { Rt.style.paddingTop = ''; return; }
  Rt.style.paddingTop = '0px';
  const delta = target.getBoundingClientRect().top - Rt.getBoundingClientRect().top;
  Rt.style.paddingTop = Math.max(0, Math.round(delta)) + 'px';
}

function wire() {
  document.querySelectorAll('[data-go]').forEach((el) => {
    el.onclick = () => { route = el.dataset.go; built = null; statusHtml = ''; render(); };
  });
  const on = (sel, fn) => { const el = document.querySelector(sel); if (el) el.onclick = fn; };
  on('[data-connect]', connect);
  on('[data-disc]', disconnect);
  on('[data-sign]', sign);
  on('[data-loadd]', () => leftover('add'));
  on('[data-losell]', () => leftover('sell'));
  on('[data-cancel]', () => { built = null; statusHtml = ''; render(); });
  on('[data-review="invest"]', () => review('invest'));
  on('[data-review="withdraw"]', () => review('withdraw'));
  on('[data-wmax]', () => { if (holder) { wAmt = (Number(holder.rawUnits) / 1e9).toString(); render(); } });

  const amt = $('amt');
  if (amt) {
    amt.oninput = () => {
      amount = amt.value;
      const go = document.querySelector('[data-review="invest"], .go .mbtn');
      if (go) go.disabled = !amount || busy;
    };
    amt.onchange = () => render();
  }
  const wamt = $('wamt');
  if (wamt) { wamt.oninput = () => { wAmt = wamt.value; }; wamt.onchange = () => render(); }
  const cs = $('coin');
  if (cs) cs.onchange = () => { coin = cs.value; render(); };
  const wcs = $('wcoin');
  if (wcs) wcs.onchange = () => { wCoin = wcs.value; render(); };
}

  skyc.width = SW * d; skyc.height = SH * d; sx.setTransform(d, 0, 0, d, 0, 0);

const cssv = (v) => getComputedStyle(document.body).getPropertyValue(v).trim();
function rgba(hex, a) {
  let h = hex.replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  const n = parseInt(h, 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
const wob = (R, th) => 0.055 * R * (Math.sin(3 * th + R * 0.0104) + 0.66 * Math.sin(5 * th - R * 0.0067 + 1.9)
  + 0.42 * Math.sin(8 * th + R * 0.0041 + 3.7) + 0.28 * Math.sin(2 * th - R * 0.0025 + 5.1));
function ridge(cx, base, hh, hw, seed) {
  const p = [[cx - hw, base]]; const n = 4; let i, f;
  for (i = 1; i <= n; i++) {
    f = i / (n + 1);
    p.push([cx - hw + hw * f * 1.02, base - hh * Math.pow(f, 0.78) + hh * 0.13 * Math.sin(seed + i * 2.27)]);
  }
  p.push([cx + hw * 0.04, base - hh]);
  for (i = 1; i <= n; i++) {
    f = i / (n + 1);
    p.push([cx + hw * 0.04 + hw * 0.96 * f, base - hh * (1 - Math.pow(f, 0.72)) + hh * 0.115 * Math.sin(seed * 1.63 + i * 2.91)]);
  }
  p.push([cx + hw, base]); return p;
}
function poly(p, close, fill, stroke, lw) {
  sx.beginPath();
  for (let i = 0; i < p.length; i++) { if (i === 0) sx.moveTo(p[i][0], p[i][1]); else sx.lineTo(p[i][0], p[i][1]); }
  if (close) sx.closePath();
  if (fill) { sx.fillStyle = fill; sx.fill(); }
  if (stroke) { sx.strokeStyle = stroke; sx.lineWidth = lw; sx.stroke(); }
}
function skyFrame() {
  const ink = cssv('--ink'), paper = cssv('--paper'), ice = cssv('--ice');
  const W = SW, H = SH, NR = W < 861;
  const HZ = H * (NR ? 0.68 : 0.825);
  const VS = (NR ? Math.min(H * 0.50, W * 0.95) : Math.min(H, W * 0.62)) * 0.74;
  /* Below 1120 the radial labels run under the figures box -- measured, the
     last collision is at 1080 -- so the holdings table in the left column
     carries them instead; its swatches are the same four wedge colours. */
  const labR = Math.min(W, H) * 0.235;
  const labels = W >= 1120 && !(route !== 'home' && wallet);
  const sunX = W * (NR ? 0.62 : 0.70), sunY = H * (NR ? 0.40 : 0.375);
  const sunR = Math.min(W, H) * (NR ? 0.05 : 0.042);
  sx.fillStyle = paper; sx.fillRect(0, 0, W, H);
  sx.lineJoin = 'round'; sx.lineCap = 'round';

  sx.save(); sx.beginPath(); sx.rect(0, 0, W, HZ); sx.clip();
  const maxR = Math.hypot(Math.max(sunX, W - sunX), Math.max(sunY, HZ - sunY)) * 1.06;
  const RINGS = 30, S = maxR / RINGS, SEG = 88, HALF = Math.PI * 1.5, A0 = -Math.PI * 0.75;
  const shades = HOLD.map((h) => cssv(h.s));
  function ring(R, th0, th1, steps) {
    sx.beginPath();
    for (let k = 0; k <= steps; k++) {
      const th = th0 + (th1 - th0) * k / steps, rr = R + wob(R, th);
      const px = sunX + rr * Math.cos(th), py = sunY + rr * Math.sin(th) * 0.86;
      if (k === 0) sx.moveTo(px, py); else sx.lineTo(px, py);
    }
    sx.stroke();
  }
  for (let n = 0; n <= RINGS; n++) {
    const R = S * (n + T);
    if (R < sunR * 1.35 || R > maxR) continue;
    const idx = Math.round(R / S);
    const a = 0.62 * Math.min(1, (R - sunR * 1.35) / (S * 2.2)) * Math.pow(Math.max(0, 1 - R / maxR), 0.75);
    if (a <= 0.012) continue;
    const major = (idx % 5 === 0);
    sx.strokeStyle = rgba(ice, major ? Math.min(0.62, a * 1.35) : a * 0.72);
    sx.lineWidth = major ? 1.6 : 1;
    ring(R, A0 + HALF, A0 + TAU, Math.round(SEG / 4));
    let a0 = A0;
    for (let si = 0; si < HOLD.length; si++) {
      const span = HOLD[si].w / 100 * HALF, st = Math.max(7, Math.round(span / HALF * SEG * 0.55));
      sx.strokeStyle = rgba(shades[si], major ? Math.min(0.95, a * 1.9) : a * 1.15);
      sx.lineWidth = major ? 1.9 : 1.1;
      ring(R, a0, a0 + span, st);
      a0 += span;
    }
  }
  let bA = A0;
  for (let bi = 0; bi <= HOLD.length; bi++) {
    const bx = Math.cos(bA), by = Math.sin(bA) * 0.86, bL = maxR * 0.62;
    sx.strokeStyle = paper; sx.lineWidth = 5;
    sx.beginPath(); sx.moveTo(sunX + bx * sunR * 1.2, sunY + by * sunR * 1.2);
    sx.lineTo(sunX + bx * bL, sunY + by * bL); sx.stroke();
    sx.strokeStyle = rgba(ink, 0.10); sx.lineWidth = 1;
    sx.beginPath(); sx.moveTo(sunX + bx * sunR * 1.2, sunY + by * sunR * 1.2);
    sx.lineTo(sunX + bx * bL, sunY + by * bL); sx.stroke();
    if (bi < HOLD.length) bA += HOLD[bi].w / 100 * HALF;
  }
  const vw = W * (NR ? 0.62 : 0.40);
  const veil = sx.createLinearGradient(0, 0, vw, 0);
  veil.addColorStop(0, rgba(paper, 1)); veil.addColorStop(0.55, rgba(paper, 0.86));
  veil.addColorStop(1, rgba(paper, 0));
  sx.fillStyle = veil; sx.fillRect(0, 0, vw, HZ);
  sx.restore();

  sx.strokeStyle = ice; sx.lineWidth = 2.4;
  sx.beginPath(); sx.arc(sunX, sunY, sunR, 0, TAU); sx.stroke();
  sx.lineWidth = 1.6; sx.globalAlpha = 0.8;
  for (let q = 0; q < 4; q++) {
    const A = q * 1.5708 + 0.7854;
    sx.beginPath(); sx.moveTo(sunX + Math.cos(A) * sunR * 1.35, sunY + Math.sin(A) * sunR * 1.35);
    sx.lineTo(sunX + Math.cos(A) * sunR * 1.75, sunY + Math.sin(A) * sunR * 1.75); sx.stroke();
  }
  sx.globalAlpha = 1;

  const far = [[.04, .10, .07], [.17, .062, .05], [.29, .125, .082], [.42, .072, .055],
    [.55, .115, .078], [.68, .058, .048], [.80, .132, .086], [.93, .078, .06]];
  for (let i = 0; i < far.length; i++) {
    poly(ridge(W * far[i][0], HZ, VS * far[i][1], W * far[i][2], i * 1.7 + 0.4), 0, null, rgba(ice, 0.34), 2.1);
  }
  const near = [[.02, .20, .105, 2.1], [.185, .315, .135, 5.3], [.375, .155, .088, 1.2],
    [.55, .275, .125, 3.8], [.735, .36, .15, 6.1], [.925, .205, .115, 4.4]];
  for (let j = 0; j < near.length; j++) {
    poly(ridge(W * near[j][0], HZ, VS * near[j][1], W * near[j][2], near[j][3]), 1, paper, ice, 4.2);
  }
  sx.strokeStyle = ink; sx.lineWidth = 2.4;
  sx.beginPath(); sx.moveTo(0, HZ); sx.lineTo(W, HZ); sx.stroke();
  const D = H - HZ;
  sx.strokeStyle = rgba(ice, 0.22); sx.lineWidth = 1;
  for (let g = 1; g <= 4; g++) {
    const gy = HZ + D * Math.pow(g / 4, 1.8);
    sx.beginPath(); sx.moveTo(0, gy); sx.lineTo(W, gy); sx.stroke();
  }

  if (NR) { sx.fillStyle = rgba(paper, 0.76); sx.fillRect(0, 0, W, H); }
  else {
    const cv2 = W * 0.42, lv = sx.createLinearGradient(0, 0, cv2, 0);
    lv.addColorStop(0, rgba(paper, 0.96)); lv.addColorStop(0.62, rgba(paper, 0.84));
    lv.addColorStop(0.85, rgba(paper, 0.42)); lv.addColorStop(1, rgba(paper, 0));
    sx.fillStyle = lv; sx.fillRect(0, 0, cv2, H);
  }

  if (labels) {
    let c0 = A0;
    for (let r2 = 0; r2 < HOLD.length; r2++) {
      const hd = HOLD[r2], sp = hd.w / 100 * HALF, am = c0 + sp / 2, col = shades[r2];
      const ux = Math.cos(am), uy = Math.sin(am) * 0.86;
      const nudge = Math.max(0, (0.45 - Math.abs(ux)) * labR * 1.2);
      const x2 = sunX + ux * labR + nudge, y2 = sunY + uy * labR;
      const dx = x2 - sunX, dy = y2 - sunY, dl = Math.max(1, Math.hypot(dx, dy)), k = sunR * 1.9 / dl;
      const tx = x2 + 14;
      sx.strokeStyle = col; sx.lineWidth = 2.6; sx.lineCap = 'round';
      sx.beginPath(); sx.moveTo(sunX + dx * k, sunY + dy * k); sx.lineTo(x2, y2); sx.stroke();
      sx.textAlign = 'left'; sx.textBaseline = 'alphabetic';
      sx.lineJoin = 'round'; sx.strokeStyle = paper;
      const lab = (txt, fnt, fill, yy, wid) => {
        sx.font = fnt; sx.lineWidth = wid;
        sx.strokeText(txt, tx, yy); sx.fillStyle = fill; sx.fillText(txt, tx, yy);
      };
      lab(hd.t, '700 14px Oxanium,sans-serif', ink, y2 - 13, 4);
      lab(hd.w.toFixed(1) + '%', '800 27px Oxanium,sans-serif', col, y2 + 13, 6);
      if (hd.p) lab(hd.p, '300 13px Oxanium,sans-serif', cssv('--ink-2'), y2 + 32, 4);
      c0 += sp;
    }
  }

  if (!reduce) T += 0.0027;
  if (T >= 1) T -= 1;
  requestAnimationFrame(skyFrame);
}

fitSky();
requestAnimationFrame(skyFrame);
addEventListener('resize', () => { fitSky(); alignStats(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(alignStats);
render();
load();
</script>
